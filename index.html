<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free BG Remover</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; background:#f3f4f6; color:#111827; }
  header { background:#dc2626; padding:16px; text-align:center; }
  header h1 { color:#fff; font-size:22px; margin:0; font-weight:bold; }
  .container { max-width:500px; margin:20px auto; padding:16px; }
  .box { background:#fff; border-radius:12px; padding:20px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.1); margin-bottom:16px; }
  input[type=file] { margin:16px 0; }
  button { background:#dc2626; color:#fff; border:none; padding:12px 20px; border-radius:8px; font-size:16px; margin:6px; cursor:pointer; }
  button:disabled { background:#9ca3af; }
  img { max-width:100%; border-radius:8px; margin-top:12px; background:
    repeating-conic-gradient(#e5e7eb 0% 25%, #ffffff 0% 50%) 50% / 20px 20px; }
  #status { margin-top:10px; font-size:14px; color:#6b7280; }
</style>
</head>
<body>

<header><h1>Free BG Remover</h1></header>

<div class="container">
  <div class="box">
    <p>Koi bhi photo upload karo, background hata do — bilkul free.</p>
    <input type="file" id="fileInput" accept="image/*">
    <br>
    <button id="removeBtn" disabled>Remove Background</button>
    <div id="status"></div>
  </div>

  <div class="box" id="resultBox" style="display:none;">
    <img id="resultImg" alt="Result">
    <br>
    <button id="downloadBtn">Download</button>
  </div>
</div>

<script type="module">
  import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.mjs";

  const fileInput = document.getElementById("fileInput");
  const removeBtn = document.getElementById("removeBtn");
  const status = document.getElementById("status");
  const resultBox = document.getElementById("resultBox");
  const resultImg = document.getElementById("resultImg");
  const downloadBtn = document.getElementById("downloadBtn");

  let selectedFile = null;
  let resultBlob = null;

  fileInput.addEventListener("change", (e) => {
    selectedFile = e.target.files[0];
    removeBtn.disabled = !selectedFile;
    status.textContent = "";
    resultBox.style.display = "none";
  });

  removeBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    removeBtn.disabled = true;
    status.textContent = "Processing... pehli dafa thoda time lagega.";
    try {
      resultBlob = await removeBackground(selectedFile);
      const url = URL.createObjectURL(resultBlob);
      resultImg.src = url;
      resultBox.style.display = "block";
      status.textContent = "Done!";
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
    removeBtn.disabled = false;
  });

  downloadBtn.addEventListener("click", () => {
    if (!resultBlob) return;
    const url = URL.createObjectURL(resultBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "bg-removed.png";
    a.click();
  });
</script>

</body>
</html>
